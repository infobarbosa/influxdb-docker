services:
  influxdb:
    image: influxdb:3-core
    container_name: influxdb-demo
    command: serve --object-store file --data-dir /var/lib/influxdb3 --without-auth
    ports:
      - "8181:8181"
    volumes:
      - influxdb3-data:/var/lib/influxdb3

  influxproducer:
    image: "infobarbosa/influxproducer"
    container_name: influxproducer
    environment:
      - INFLUXDB_URL=http://influxdb-demo:8181
      - DATABASE=ecommerce
    depends_on:
      - influxdb
    restart: unless-stopped

volumes:
  influxdb3-data:
